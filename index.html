<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marcos Meira — Móveis Planejados</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --marrom-escuro: #24140d;
      --marrom: #4b2d1d;
      --marrom-medio: #6b432c;
      --caramelo: #95683f;
      --bege: #c9a67d;
      --creme: #f6efe6;
      --branco: #fffaf4;
      --texto: #2d211a;
      --cinza: #75685e;
      --linha: #e4d7c8;
      --whatsapp: #25D366;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--creme);
      color: var(--texto);
      overflow-x: hidden;
    }

    img {
      width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1160px, 90%);
      margin: auto;
    }

    /* ================= HEADER ================= */

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 25px 0;
      color: white;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 24px;
      line-height: 1;
    }

    .logo span {
      display: block;
      font-family: "DM Sans", sans-serif;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 7px;
      opacity: .7;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 13px;
    }

    nav a {
      color: rgba(255,255,255,.88);
    }

    .nav-button {
      background: white;
      color: var(--marrom-escuro);
      padding: 12px 19px;
      border-radius: 50px;
      font-weight: 700;
    }

    .hero-content {
      max-width: 700px;
      padding-top: 60px;
    }

    .eyebrow {
      color: #dfc19d;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(48px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -2px;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .hero p {
      max-width: 600px;
      color: rgba(255,255,255,.82);
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 16px 23px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      transition: .3s;
    }

    .button-primary {
      background: var(--caramelo);
      color: white;
    }

    .button-primary:hover {
      transform: translateY(-2px);
      background: #a9784d;
    }

    .button-outline {
      color: white;
      border: 1px solid rgba(255,255,255,.4);
    }

    /* ================= TRUST ================= */

    .trust {
      background: var(--marrom-escuro);
      color: white;
      padding: 22px 0;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
    }

    .trust-item {
      border-right: 1px solid rgba(255,255,255,.12);
      font-size: 12px;
      color: rgba(255,255,255,.6);
      padding: 5px 15px;
    }

    .trust-item:last-child {
      border: none;
    }

    .trust-item strong {
      display: block;
      color: white;
      font-size: 13px;
      margin-bottom: 3px;
    }

    /* ================= SECTIONS ================= */

    section {
      padding: 105px 0;
    }

    .label {
      color: var(--caramelo);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .title {
      font-family: "Playfair Display", serif;
      color: var(--marrom-escuro);
      font-size: clamp(36px, 4.5vw, 56px);
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .text {
      color: var(--cinza);
      line-height: 1.8;
      font-size: 16px;
      margin-top: 20px;
    }

    /* ================= INTRO ================= */

    .intro {
      background: var(--creme);
    }

    .intro-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 80px;
      align-items: center;
    }

    .intro-image {
      height: 540px;
      overflow: hidden;
      border-radius: 5px;
    }

    .intro-image img {
      height: 100%;
      object-fit: cover;
    }

    .benefits {
      display: grid;
      gap: 13px;
      margin-top: 28px;
    }

    .benefit {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--marrom);
      color: white;
      font-size: 11px;
    }

    /* ================= PROJETOS ================= */

    .projects {
      background: var(--branco);
    }

    .center-heading {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 50px;
    }

    .center-heading .title {
      margin: auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1.15fr .85fr .85fr;
      grid-template-rows: 300px 300px;
      gap: 5px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
    }

    .gallery-item:first-child {
      grid-row: 1 / 3;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .5s;
    }

    .gallery-item:hover img {
      transform: scale(1.025);
    }

    .photo-label {
      position: absolute;
      left: 18px;
      bottom: 18px;
      background: rgba(36,20,13,.88);
      color: white;
      padding: 8px 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 9px;
      font-weight: 700;
    }

    /* ================= DIFERENCIAIS ================= */

    .difference {
      background: var(--marrom);
      color: white;
    }

    .difference-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 85px;
      align-items: center;
    }

    .difference .title {
      color: white;
    }

    .difference .text {
      color: rgba(255,255,255,.65);
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    .feature {
      border-top: 1px solid rgba(255,255,255,.16);
      padding-top: 18px;
    }

    .feature-number {
      color: #d0a978;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .feature h3 {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      margin: 8px 0;
    }

    .feature p {
      color: rgba(255,255,255,.6);
      font-size: 13px;
      line-height: 1.65;
    }

    /* ================= PROCESSO ================= */

    .process {
      background: var(--creme);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 50px;
    }

    .step {
      background: white;
      border: 1px solid var(--linha);
      padding: 28px;
      min-height: 220px;
    }

    .step-number {
      font-family: "Playfair Display", serif;
      font-size: 42px;
      color: var(--bege);
    }

    .step h3 {
      font-size: 16px;
      margin: 10px 0 8px;
      color: var(--marrom-escuro);
    }

    .step p {
      color: var(--cinza);
      font-size: 13px;
      line-height: 1.65;
    }
